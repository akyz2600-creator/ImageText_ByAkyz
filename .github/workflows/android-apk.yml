name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar la web
        run: npm run build
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ImageText-debug.apk
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ImageText-debug-apk
          path: ImageText-debug.apk
          if-no-files-found: error
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ImageText APK #${{ github.run_number }}
          body: APK de depuración (sin firmar para tienda). Descarga ImageText-debug.apk e instálalo en Android.
          files: ImageText-debug.apk
